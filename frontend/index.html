    <meta name="description" content="Paste a URL. An agent writes, runs, verifies and repairs a scraper for it." />

      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
